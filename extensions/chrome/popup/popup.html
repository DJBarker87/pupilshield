<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      color: #111827;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
    }
    .status-label { color: #6b7280; }
    .status-value { font-weight: 500; }
    .status-value.connected { color: #22c55e; }
    .status-value.disconnected { color: #9ca3af; }
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer a {
      font-size: 12px;
      color: #22c55e;
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
    .version {
      font-size: 11px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>PupilSafe AI</h1>
  </div>
  <div class="status-row">
    <span class="status-label">PupilSafe tab</span>
    <span id="pupilsafe-status" class="status-value disconnected">Checking...</span>
  </div>
  <div class="status-row">
    <span class="status-label">AI tab</span>
    <span id="ai-status" class="status-value disconnected">Checking...</span>
  </div>
  <div class="footer">
    <a href="https://pupilsafe.co.uk" target="_blank">pupilsafe.co.uk</a>
    <span class="version">v1.0.0</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
