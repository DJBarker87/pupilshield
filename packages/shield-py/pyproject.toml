[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shield-py"
version = "0.1.0"
description = "PupilSafe AI anonymisation library — Python port of @djb/shield"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
